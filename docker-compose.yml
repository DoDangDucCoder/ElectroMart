# Docker Compose for Laravel Shop Website
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-shop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-shop-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: laravel-shop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - laravel-shop-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: laravel-shop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopbanhang
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - laravel-shop-network

  redis:
    image: redis:7-alpine
    container_name: laravel-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-shop-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-shop-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8080:80"
    networks:
      - laravel-shop-network
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    container_name: laravel-shop-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel-shop-network

  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: laravel-shop-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - laravel-shop-network

  kibana:
    image: kibana:8.8.0
    container_name: laravel-shop-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - laravel-shop-network
    depends_on:
      - elasticsearch

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  laravel-shop-network:
    driver: bridge
