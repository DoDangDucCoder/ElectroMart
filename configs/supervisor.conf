; Supervisor queue worker template for production.
;
; Local development can keep QUEUE_CONNECTION=database and use:
;   php artisan queue:work database --once --stop-when-empty
;
; Production should explicitly choose one queue backend and keep this command
; aligned with .env. The command below assumes QUEUE_CONNECTION=redis.
; If production uses QUEUE_CONNECTION=database, change "redis" to "database".
; Do not run a redis worker while .env is configured for the database queue.

[program:laravel-shop-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/laravel-shop
command=/usr/bin/php /var/www/laravel-shop/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/laravel-shop/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600

; After changing this file:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl restart laravel-shop-worker:*
;
; During application deploys:
;   php artisan queue:restart
