<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Office and network hero background</title>
  <desc id="desc">Abstract office laptop, router and printer on a teal blue gradient background.</desc>
  <defs>
