<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Anker 735 one year review</title>
  <desc id="desc">Editorial card illustration for a compact charger review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <circle cx="800" cy="82" r="128" fill="#67e8f9" opacity="0.18"/>
  <circle cx="116" cy="430" r="170" fill="#ccfbf1" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="560" y="132" width="190" height="260" rx="30" fill="#f8fafc"/>
    <rect x="610" y="112" width="90" height="42" rx="10" fill="#e2e8f0"/>
    <rect x="592" y="188" width="126" height="26" rx="13" fill="#0f172a" opacity="0.1"/>
    <circle cx="626" cy="300" r="18" fill="#14b8a6"/>
    <circle cx="686" cy="300" r="18" fill="#0891b2"/>
  </g>
  <g fill="#fff">
    <text x="86" y="150" font-family="Arial, sans-serif" font-size="32" font-weight="700" opacity="0.82">REVIEW</text>
    <text x="86" y="210" font-family="Arial, sans-serif" font-size="56" font-weight="800">Anker 735</text>
    <text x="86" y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700">after one year</text>
    <text x="86" y="334" font-family="Arial, sans-serif" font-size="22" opacity="0.82">Compact GaN charger, stable power, daily carry notes.</text>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M100 392h180"/>
    <path d="M100 426h128"/>
    <path d="M100 460h220"/>
  </g>
</svg>
