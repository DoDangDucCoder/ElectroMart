  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <circle cx="762" cy="108" r="142" fill="#a7f3d0" opacity="0.15"/>
  <g filter="url(#shadow)">
    <rect x="500" y="150" width="310" height="200" rx="22" fill="#e2e8f0"/>
    <rect x="528" y="178" width="254" height="144" rx="12" fill="#0f172a"/>
