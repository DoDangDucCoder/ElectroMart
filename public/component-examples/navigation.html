<!DOCTYPE html>
<html>
<head>
    <title>Navigation Examples</title>
    <link rel="stylesheet" href="/frontend/css/responsive-base.css">
</head>
<body>
    <div class="container py-5">
        <h1>Navigation Components</h1>
        
        <section class="py-3">
            <h2>Navbar</h2>
            <nav class="navbar">
                <a class="navbar-brand" href="#">Brand</a>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </nav>
        </section>
        
        <section class="py-3">
            <h2>Breadcrumb</h2>
            <nav class="breadcrumb">
                <div class="breadcrumb-item"><a href="#">Home</a></div>
                <div class="breadcrumb-item"><a href="#">Library</a></div>
                <div class="breadcrumb-item active">Data</div>
            </nav>
        </section>
        
        <section class="py-3">
            <h2>Pagination</h2>
            <nav class="pagination">
                <div class="page-item disabled">
                    <span class="page-link">Previous</span>
                </div>
                <div class="page-item active">
                    <span class="page-link">1</span>
                </div>
                <div class="page-item">
                    <a class="page-link" href="#">2</a>
                </div>
                <div class="page-item">
                    <a class="page-link" href="#">3</a>
                </div>
                <div class="page-item">
                    <a class="page-link" href="#">Next</a>
                </div>
            </nav>
        </section>
    </div>
</body>
</html>
